name: pages
# Tests and builds the static site, then deploys it to GitHub Pages. No secrets and no BASE_PATH: the build uses relative paths
# (vite base './'), so the same dist/ works at any sub-path, and everything in it is public testnet data.
# One-time setup: Settings > Pages > Source: GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
# Only the deploy job can write to Pages; the job that runs npm ci and the tests reads the repo only.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
